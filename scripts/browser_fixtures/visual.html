<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>纯样式变化</title>
<style>
  .done .label { color: rgb(153, 153, 153); }
  .is-focused { outline: 2px solid rgb(0, 0, 255); }
  .tick { background-color: rgb(255, 255, 0); }
  .opt.selected { background-color: rgb(230, 244, 255); }
  .flash { box-shadow: 0 0 0 4px rgb(255, 0, 0); }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 10px; height: 10px; animation: spin 0.5s linear infinite; }
  /* bootstrap / antd 式焦点样式：带过渡（复审 #1） */
  .ff { border: 2px solid rgb(200, 200, 200); transition: border-color .3s, box-shadow .3s; }
  .ff:focus { border-color: rgb(13, 110, 253); box-shadow: 0 0 0 3px rgb(180, 200, 255); }
  /* 滚到可见才淡入（复审 #2） */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .4s, transform .4s; }
  .reveal.in { opacity: 1; transform: none; }
  /* 真变化，但带过渡（复审 #6：面板隐藏时过渡不走） */
  .fade { background-color: rgb(255, 255, 255); transition: background-color .3s; }
  .fade.on { background-color: rgb(0, 128, 0); }
</style>
</head>
<body>
<!-- 真变化：只改颜色（文字树看不见），应当报出来 -->
<ul>
  <li id="todo"><button id="done">完成</button> <span class="label">写周报</span></li>
</ul>

<!-- 假变化陷阱：class 变了但没有任何样式 -->
<div><button id="track" onclick="this.classList.toggle('tracked-click')">埋点按钮</button></div>

<!-- 假变化陷阱：聚焦时页面自己加的焦点样式，我们的聚焦在基线之前做完 -->
<div><button id="focusy">焦点按钮</button></div>

<!-- 假变化陷阱：旁边有个自己在跳的时钟、一直转的加载图标，按钮本身什么都不做 -->
<div id="row"><button id="noop">空按钮</button> <span id="clock">12:00</span> <span class="spinner"></span></div>

<!-- 假变化陷阱：点击时闪一下又恢复（波纹 / 点击反馈），结束后什么都没变 -->
<div><button id="flashy">闪一下</button></div>

<!-- 真变化：类似 antd 下拉选项，选中只靠 class 上的背景色 -->
<div class="list">
  <div class="opt" role="option" id="optA">北京</div>
  <div class="opt" role="option" id="optB">上海</div>
</div>

<!-- 假变化陷阱：焦点样式带过渡，点了什么都不做（复审 #1） -->
<div><button id="ffbtn" class="ff">过渡焦点按钮</button></div>

<!-- 聚焦时页面往名字里插字（antd Tabs 的「Tab 1 of 3」）：第一次点击不能被拒（复审 #10） -->
<div><button id="tabby">标签甲</button> <span id="tabout">-</span></div>

<!-- 真变化带过渡 -->
<div><button id="fadebtn" class="fade">变色过渡</button></div>

<!-- 真变化，按钮本身还带聚焦过渡：基线等聚焦过渡跑完再记，点击的变化才不会被当成
     「动作前就在变」吞掉（复审 #1） -->
<div><button id="ffreal" class="ff">聚焦过渡又变色</button></div>

<!-- 慢导航：服务器 8 秒才回（复审 #5） -->
<div><a id="slowlink" href="/slow">慢链接</a></div>

<!-- 假变化陷阱：滚到可见才淡入，按钮什么都不做（复审 #2） -->
<div style="height: 1600px"></div>
<div class="reveal" id="rv"><button id="rvbtn">底部按钮</button></div>

<script>
  document.getElementById("tabby").addEventListener("focus", e => {
    if (!e.target.dataset.n) { e.target.dataset.n = "1"; e.target.textContent = "Tab 1 of 3 标签甲"; }
  });
  document.getElementById("tabby").addEventListener("click", () =>
    document.getElementById("tabout").textContent = "标签甲被点了");
  document.getElementById("fadebtn").addEventListener("click", e => e.target.classList.toggle("on"));
  document.getElementById("ffreal").addEventListener("click", e => e.target.style.color = "rgb(200, 0, 0)");
  new IntersectionObserver(es => es.forEach(x => x.isIntersecting && x.target.classList.add("in")))
    .observe(document.getElementById("rv"));
  document.getElementById("done").addEventListener("click", () =>
    document.getElementById("todo").classList.toggle("done"));
  const f = document.getElementById("focusy");
  f.addEventListener("focus", () => f.classList.add("is-focused"));
  f.addEventListener("blur", () => f.classList.remove("is-focused"));
  // 时钟每跳一下颜色都不同（只在两个值之间切换的话，动作结束时有一半概率恰好回到原色，
  // "自己在变的元素"这个陷阱就时有时无）
  let tick = 0;
  setInterval(() => {
    tick = (tick + 1) % 200;
    document.getElementById("clock").style.backgroundColor = "rgb(" + (50 + tick) + ", 0, 0)";
  }, 60);
  document.getElementById("flashy").addEventListener("click", e => {
    e.target.classList.add("flash");
    setTimeout(() => e.target.classList.remove("flash"), 80);
  });
  for (const o of document.querySelectorAll(".opt"))
    o.addEventListener("click", () => {
      for (const x of document.querySelectorAll(".opt")) x.classList.remove("selected");
      o.classList.add("selected");
    });
</script>
</body>
</html>
