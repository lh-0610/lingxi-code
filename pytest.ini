[pytest]
addopts = -p no:cacheprovider --basetemp=D:/langchain_pytest_tmp
testpaths = scripts
# 评测 fixture 不参与常规收集：scripts/evals/fixtures/ 下的 test_*.py 是**给 agent 修的
# 素材**，其中 broken-calc 必须是失败的（fixture 本身全绿的话 case 001 会恒通过、
# 毫无意义，test_eval_runner.py 里有一条测试专门守着这个）。它们只在 agent 跑评测时、
# 在临时副本里被执行。
norecursedirs = scripts/evals/fixtures scripts/evals/fixtures/*
