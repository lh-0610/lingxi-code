name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    # 灵犀是 Windows 桌面应用（taskkill / Windows Job Object / PySide6），CI 也跑 Windows 对齐真机
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ── ruff 仓库级 lint：轻量、稳定，主门禁（规则集见 pyproject.toml）──
      # 所有 pip install 都带 -c requirements.lock：版本钉死，CI 结果不随上游发版漂移。
      - name: Install ruff
        run: pip install ruff -c requirements.lock
      - name: Ruff check
        run: python -m ruff check src/

      # ── pytest：装齐 requirements-dev.txt（含可选依赖）跑测试套件 ──
      # 与 CLAUDE.md 里开发机的装法一致。早先只装核心依赖，但测试套件默认 tree-sitter 语言包 /
      # mcp / bs4 都在（代码地图、语法高亮、MCP 包装、网页正文提取都按真实库断言），于是从
      # 2026-10-28 起 CI 一直红、而开发机全绿。缺依赖时的降级路径由各自测试打桩覆盖，不靠少装。
      - name: Install deps
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Pytest
        run: python -m pytest scripts/ -q
